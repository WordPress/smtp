# Codecov settings. See https://docs.codecov.com/docs/codecovyml-reference

coverage:
  status:
    # Project coverage, compared with the base commit.
    project:
      default:
        base: auto
        target: auto
        threshold: 5%
        # Never blocks a pull request. Make it a real check once coverage is stable.
        informational: true
        only_pulls: true
    # Coverage of the lines a pull request changes.
    patch:
      default:
        base: auto
        target: auto
        threshold: 50%
        informational: true
        only_pulls: true

# No pull request comments.
comment: false

ignore:
  - tests
  - vendor
  - node_modules
  - build
