name: Deploy

# Run deploy only on published releases. Pre-releases (e.g. 1.2.0-beta.1) are skipped.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to WordPress.org
    if: ${{ ! github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: '--prefer-dist --no-dev'

      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          ZIP_PATH: ${{ steps.deploy.outputs.zip-path }}
        run: |
          cp "$ZIP_PATH" "${{ github.event.repository.name }}.zip"
          gh release upload "$TAG" "${{ github.event.repository.name }}.zip" --clobber
